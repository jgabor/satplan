<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <meta
      name="description"
      content="Self-contained Satisfactory production chains with building counts."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>satplan</title>
  </head>
  <body>
    <header class="top">
      <div class="bar-line">
        <h1>satplan</h1>
        <span id="count" class="count num"></span>
        <span class="progress" aria-hidden="true"><span id="bar"></span></span>
      </div>
      <div class="filters">
        <label class="search"
          ><span class="sr">Search chains</span
          ><input
            id="q"
            type="search"
            placeholder="Search item, recipe or raw input ( / )"
            autocomplete="off"
            spellcheck="false"
        /></label>
        <label class="sr" for="metric">Rank chains by</label>
        <select id="metric"></select>
        <div class="extraction">
          <label class="sr" for="miner">Miner level</label>
          <select id="miner">
            <option value="1">Miner Mk.1</option>
            <option value="2" selected>Miner Mk.2</option>
            <option value="3">Miner Mk.3</option>
          </select>
          <label class="sr" for="purity">Node purity</label>
          <select id="purity">
            <option value="impure">Impure nodes</option>
            <option value="normal">Normal nodes</option>
            <option value="pure" selected>Pure nodes</option>
          </select>
        </div>
        <label class="todo"><input id="todo" type="checkbox" /> To build</label>
        <button id="copy" type="button">Copy link</button>
      </div>
      <input id="link-box" type="text" readonly hidden aria-label="Link to copy" />
    </header>
    <main>
      <p id="status" class="status num" aria-live="polite"></p>
      <div id="list"></div>
    </main>
    <footer>
      Recipe data from
      <a
        href="https://github.com/satisfactory-factories/application/blob/main/parsing/gameData.json"
        >Satisfactory Factories</a
      >
      (<span id="source"></span>). Water extractors 120 m³/min. All state is in the link. Item icons
      are Satisfactory game assets © Coffee Stain Studios.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
