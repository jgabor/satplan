<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161616" />
    <meta
      name="description"
      content="Self-contained Satisfactory production chains with building counts."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/src/fonts/roboto-condensed-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>satplan</title>
  </head>
  <body>
    <header class="top">
      <div class="bar-line">
        <h1>satplan</h1>
        <span id="count" class="count num"></span>
        <span class="progress" aria-hidden="true"><span id="bar"></span></span>
      </div>
      <div class="filters">
        <label class="search"
          ><span class="sr">Search chains</span
          ><input
            id="q"
            type="search"
            placeholder="Search item, recipe or input"
            autocomplete="off"
            spellcheck="false"
            aria-keyshortcuts="/"
          /><kbd class="key" aria-hidden="true">/</kbd></label
        >
        <div id="settings" class="settings">
          <label class="sr" for="metric">Rank chains by</label>
          <select id="metric"></select>
          <div class="extraction">
            <label class="sr" for="miner">Miner level</label>
            <select id="miner">
              <option value="1">Miner Mk.1</option>
              <option value="2" selected>Miner Mk.2</option>
              <option value="3">Miner Mk.3</option>
            </select>
            <label class="sr" for="purity">Node purity</label>
            <select id="purity">
              <option value="impure">Impure nodes</option>
              <option value="normal">Normal nodes</option>
              <option value="pure" selected>Pure nodes</option>
            </select>
          </div>
          <label class="sr" for="tier">Unlocked tiers</label>
          <select id="tier"></select>
        </div>
        <label class="todo"><input id="todo" type="checkbox" /> Remaining</label>
        <button
          id="options"
          class="options"
          type="button"
          aria-expanded="false"
          aria-controls="settings"
        >
          Options
        </button>
      </div>
    </header>
    <main>
      <div class="statusbar">
        <p id="status" class="status num" aria-live="polite"></p>
        <p id="pick-status" class="sr" aria-live="polite" aria-atomic="true"></p>
        <button id="fold" class="fold" type="button"></button>
      </div>
      <div id="list"></div>
    </main>
    <footer>
      Recipe data from
      <a
        href="https://github.com/satisfactory-factories/application/blob/main/parsing/gameData.json"
        >Satisfactory Factories</a
      >
      (<span id="source"></span>). Water extractors 120 m³/min. Your plan is kept in the link and in
      this browser. Item icons are Satisfactory game assets © Coffee Stain Studios.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
